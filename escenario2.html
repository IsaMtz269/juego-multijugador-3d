<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Escenario Multijugador</title>
    <link rel="stylesheet" href="public/styles.css">
    <link rel="stylesheet" href="public/estilos/estilos.css">
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@v0.155.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@v0.155.0/examples/jsm/"
        }
    }
    </script>
    
    <style>
        body {
            margin: 0;
            overflow: auto; 
            padding: 20px;
            font-family: Arial, sans-serif; /* Para que el texto se vea más limpio */
        }

        #controles-conexion {
            margin-bottom: 20px;
        }

        #juego-container {
            width: 100%;       
            height: 70vh; /* Lo hice un poco más alto (70vh) para que el juego luzca más */      
            position: relative; 
            overflow: hidden;  
            border: 2px solid #ccc; 
            background-color: #87ceeb; /* Fondo azul cielo */
            border-radius: 8px; /* Bordes ligeramente redondeados */
        }
    </style>
</head>

<body>
    


    <div id="controles-conexion">
        <label for="idNombreJugador"><strong>Nombre Jugador:</strong></label>
        <input id="idNombreJugador" type="text" autocomplete="off" placeholder="Ingresa tu nombre..." />
        <input id="idBoton" type="button" value="Conectar" />
    </div>

    <div id="juego-container"></div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="public/agregar.js"></script> <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('juego-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        
        // Alejamos la cámara un poco más para que puedas ver todo el escenario
        camera.position.set(15, 12, 15); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); 
        renderer.setSize(width, height);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0); 
        controls.update(); 

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        var nombreJugador2 = "";
        var nombreJugador1 = "";
        const socket = io();

        // Función de carga de modelos
        function cargarModelo3D(path, nombre, escala = new THREE.Vector3(1, 1, 1)) {
            return new Promise((resolve, reject) => {
                const manager = new THREE.LoadingManager();
                const loaderOBJ = new OBJLoader(manager);
                const loaderMTL = new MTLLoader(manager);

                loaderMTL.setResourcePath('public/');

                loaderMTL.load(path + '.mtl',
                    function (materials) {
                        materials.preload();
                        loaderOBJ.setMaterials(materials);

                        loaderOBJ.load(path + '.obj',
                            function (object) {
                                object.name = nombre;
                                object.scale.copy(escala);
                                console.log(`✅ Modelo ${nombre} cargado correctamente con texturas`);
                                resolve(object);
                            },
                            function (xhr) {
                                console.log(`${nombre}: ${(xhr.loaded / xhr.total * 100)}% cargado`);
                            },
                            function (error) {
                                console.error(`❌ Error cargando ${nombre}:`, error);
                                reject(error);
                            }
                        );
                    },
                    undefined,
                    function (error) {
                        console.error(`❌ Error cargando MTL de ${nombre}:`, error);
                        reject(error);
                    }
                );
            });
        }

        // 1. Cargar el Escenario
        const escenario = await cargarModelo3D('public/escenario-arcoiris', 'MiEscenario', new THREE.Vector3(3, 3, 3));
        escenario.position.set(0, 0, 0); 
        scene.add(escenario);

        // 2. Crear Jugador Local (Cubo Azul)
        const geometryLocal = new THREE.BoxGeometry(1, 1, 1);
        const materialLocal = new THREE.MeshBasicMaterial({ color: 0x0000ff }); 
        const jugadorLocal = new THREE.Mesh(geometryLocal, materialLocal);
        jugadorLocal.position.set(-12, 6.4, 14); 
        scene.add(jugadorLocal);

        // 3. Crear Jugador 2 (Cubo Rojo)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(-14, 6.4, 14); 
        scene.add(cube);

        // Sockets
        socket.on('Iniciar', (nombre) => {
            console.log('Se conectó: ' + nombre);
            if (nombre !== nombreJugador1) {
                nombreJugador2 = nombre;
            }
        });

        socket.on('Posicion', (position, nombre) => {
            if (nombre !== nombreJugador1) {
                // Actualiza la posición del cubo rojo
                cube.position.set(position.x, position.y, position.z);
            }
        });

        // Controles de movimiento
        document.addEventListener('keydown', (event) => {
            if (!nombreJugador1) {
                console.log("Primero debes conectar un jugador.");
                return; 
            }

            if (event.key === 'a') jugadorLocal.position.x -= 0.5;
            if (event.key === 'd') jugadorLocal.position.x += 0.5;
            if (event.key === 'w') jugadorLocal.position.z -= 0.5; 
            if (event.key === 's') jugadorLocal.position.z += 0.5; 
            
            // Emitimos la posición del jugador local
            socket.emit('Posicion', jugadorLocal.position, nombreJugador1);
        });

        // Ciclo de Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        
        animate();

        // Botón de conexión
        var btnConectar = document.getElementById("idBoton");
        btnConectar.addEventListener('click', iniciarConexion);

        function iniciarConexion() {
            nombreJugador1 = document.getElementById("idNombreJugador").value;
            if(nombreJugador1.trim() !== "") {
                socket.emit('Iniciar', nombreJugador1);
                console.log("Conectado como: " + nombreJugador1);
                // Opcional: Deshabilitar el input y el botón después de conectar
                document.getElementById("idNombreJugador").disabled = true;
                btnConectar.disabled = true;
                btnConectar.value = "Conectado";
            } else {
                alert("Por favor ingresa un nombre válido.");
            }
        }

        // Ajustar pantalla
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

    </script>
</body>
</html>
