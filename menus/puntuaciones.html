<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Race Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/puntuaciones.css">
</head>
<body>

  <div class="scanlines"></div>

  <div class="container">

    <div class="header">
      <div class="checkered-bar"></div>
      <h1 class="title">
        <span class="title-flag">🏁</span>
        RACE RESULTS
        <span class="title-flag">🏁</span>
      </h1>
      <div class="subtitle">CLASIFICACIÓN FINAL</div>
      <div class="checkered-bar"></div>
    </div>

    <div class="scoreboard">

      <div class="score-row rank-1" style="--delay: 0.1s">
        <div class="position">
          <span class="pos-number">1</span>
          <span class="pos-suffix">ST</span>
        </div>
        <div class="car-icon">🏎️</div>
        <div class="player-info">
          <span class="player-tag" id="player1-name">---</span>
          <span class="player-label">CHAMPION</span>
        </div>
        <div class="score-value" id="player1-score">0</div>
        <div class="medal">🥇</div>
      </div>

      <div class="score-row rank-2" style="--delay: 0.25s">
        <div class="position">
          <span class="pos-number">2</span>
          <span class="pos-suffix">ND</span>
        </div>
        <div class="car-icon">🏎️</div>
        <div class="player-info">
          <span class="player-tag" id="player2-name">---</span>
          <span class="player-label">PILOT</span>
        </div>
        <div class="score-value" id="player2-score">0</div>
        <div class="medal">🥈</div>
      </div>

      <div class="score-row rank-3" style="--delay: 0.4s">
        <div class="position">
          <span class="pos-number">3</span>
          <span class="pos-suffix">RD</span>
        </div>
        <div class="car-icon">🏎️</div>
        <div class="player-info">
          <span class="player-tag" id="player3-name">---</span>
          <span class="player-label">RACER</span>
        </div>
        <div class="score-value" id="player3-score">0</div>
        <div class="medal">🥉</div>
      </div>

      <div class="score-row rank-4" style="--delay: 0.55s">
        <div class="position">
          <span class="pos-number">4</span>
          <span class="pos-suffix">TH</span>
        </div>
        <div class="car-icon">🚗</div>
        <div class="player-info">
          <span class="player-tag" id="player4-name">---</span>
          <span class="player-label">RACER</span>
        </div>
        <div class="score-value" id="player4-score">0</div>
        <div class="medal"></div>
      </div>

      <div class="score-row rank-5" style="--delay: 0.7s">
        <div class="position">
          <span class="pos-number">5</span>
          <span class="pos-suffix">TH</span>
        </div>
        <div class="car-icon">🚗</div>
        <div class="player-info">
          <span class="player-tag" id="player5-name">---</span>
          <span class="player-label">RACER</span>
        </div>
        <div class="score-value" id="player5-score">0</div>
        <div class="medal"></div>
      </div>

    </div>

    <div class="footer">
      <div class="credits">CRÉDITOS: 04</div>
      <div class="blink-text">PULSA CUALQUIER BOTÓN PARA CONTINUAR</div>
      <div class="credits">CRÉDITOS: 04</div>
    </div>

  </div>

  <script
    type="module"
    src="/public/js/menus/ScoreSystem.js"
></script>


</body>
</html>
