<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar mapa</title>
    <link rel="stylesheet" href="/menus/css/selectMap.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <h1>Selecciona mapa</h1>

    <div class="cards-container">

        <button class="map-btn" data-map="1">
            <div class="map-preview-placeholder map-dia">☀️</div>
            <div class="map-info">
                <div class="map-name">Día</div>
                <div class="map-desc">Pista abierta bajo el sol</div>
            </div>
        </button>

        <button class="map-btn" data-map="2">
            <div class="map-preview-placeholder map-arco">🌈</div>
            <div class="map-info">
                <div class="map-name">Arcoíris</div>
                <div class="map-desc">Colores que desafían la velocidad</div>
            </div>
        </button>

        <button class="map-btn" data-map="3">
            <div class="map-preview-placeholder map-rojo">🔥</div>
            <div class="map-info">
                <div class="map-name">Rojo</div>
                <div class="map-desc">Pista de fuego, solo para los mejores</div>
            </div>
        </button>

    </div>

    <button class="back-btn" onclick="window.location.href='/select-mode'">← Volver</button>

    <script type="module" src="/public/js/menus/SelectMap.js"></script>
</body>
</html>
