<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar modo</title>
    <link rel="stylesheet" href="/menus/css/selectMode.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <h1>Selecciona modo</h1>

    <div class="cards-container">
        <button id="single-btn" class="mode-card">
            <div class="card-icon">🏎️</div>
            <div class="card-title">Singleplayer</div>
            <div class="card-desc">Compite solo contra el tiempo y la pista</div>
        </button>

        <button id="multi-btn" class="mode-card">
            <div class="card-icon">👥</div>
            <div class="card-title">Multiplayer</div>
            <div class="card-desc">Reta a otros jugadores en tiempo real</div>
        </button>
    </div>

    <button class="back-btn" onclick="window.location.href='/menu'">← Volver</button>



    <script type="module" src="/public/js/menus/SelectMode.js"></script>
</body>
</html>
