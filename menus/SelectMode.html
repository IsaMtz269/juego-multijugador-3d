<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar modo</title>
    <link rel="stylesheet" href="/menus/css/selectMode.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <h1>Selecciona modo</h1>

    <div class="cards-container">
        <button id="single-btn" class="mode-card">
            <div class="card-icon">🏎️</div>
            <div class="card-title">Singleplayer</div>
            <div class="card-desc">Compite solo contra el tiempo y la pista</div>
        </button>

        <button id="multi-btn" class="mode-card">
            <div class="card-icon">👥</div>
            <div class="card-title">Multiplayer</div>
            <div class="card-desc">Reta a otros jugadores en tiempo real</div>
        </button>
    </div>

    <button class="back-btn" onclick="window.location.href='/menu'">← Volver</button>

    <div id="name-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center;">
        <h2 style="color: white; font-family: Arial, sans-serif; margin-bottom: 20px;">INGRESA TU NOMBRE</h2>
        
        <input type="text" id="player-name-input" autocomplete="off" placeholder="Tu nombre..." style="padding: 15px; font-size: 20px; width: 300px; text-align: center; border-radius: 8px; border: 2px solid #555; margin-bottom: 20px;">
        
        <button id="confirm-name-btn" style="padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #ffaa00; border: none; border-radius: 8px;">CONECTAR</button>
    </div>

    <script type="module" src="/public/js/menus/SelectMode.js"></script>
</body>
</html>
